<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f15" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="life-os">
  <title>{% block title %}life-os{% endblock %}</title>
  <link rel="manifest" href="{{ asset('manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">
  <link rel="icon" href="{{ asset('icon-512.png') }}">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
  <script src="{{ asset('mention.js') }}" defer></script>
  <script src="{{ asset('linker.js') }}" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
  <script src="{{ asset('daypeople.js') }}" defer></script>
  <script src="{{ asset('chipfield.js') }}" defer></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <!-- Start loading a page when a finger touches a link (or the mouse hovers it), not when it lifts. -->
  <script src="https://unpkg.com/htmx-ext-preload@2.1.0/preload.js"></script>
</head>
<body hx-boost="true" hx-ext="preload">
  <i id="asset-v" hidden data-css="{{ asset('style.css') }}"></i>
  <main class="{% block main_class %}{% endblock %}" preload="mouseover">
    {# Back / forward: the home-screen app has no browser buttons. #}
    <nav class="histnav" aria-label="History">
      <button type="button" onclick="history.back()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" onclick="history.forward()" aria-label="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
    {% block content %}{% endblock %}</main>
  {% set path = request.url.path %}
  <nav class="tabbar" aria-label="Sections" preload="mouseover">
    <ul>
      <li><a href="/" {% if path == "/" or path.startswith("/day") %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>
        Today</a></li>
      <li><a href="/journal" {% if path.startswith("/journal") %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h11a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H6z"/><path d="M6 3.5v17M9.5 8h5.5M9.5 11.5h5.5"/></svg>
        Journal</a></li>
      <li><a href="/calendar" {% if path.startswith("/calendar") %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>
        Month</a></li>
      <li><a href="/todos" {% if path.startswith("/todos") %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.2"/><circle cx="6" cy="17" r="2.2"/><path d="M11 7h9M11 17h9"/></svg>
        Todos</a></li>
      <li><a href="/people" {% if path.startswith("/people") %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M15.5 5.2a3.3 3.3 0 0 1 0 6.6M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>
        People</a></li>
      <li><a href="/search" {% if path.startswith("/search") or path.startswith("/notes") %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        Search</a></li>
    </ul>
  </nav>
  <script>
    // Show which photos were picked next to a hidden file input.
    // iOS Safari (26.5+) can send a picked photo as 0 bytes when a service worker controls the page
    // (WebKit bugs 319396, 319985); copies held in memory upload fine, so swap them in right away.
    if (!window.photoPickReady) {
      window.photoPickReady = true;
      document.addEventListener("change", async (e) => {
        const input = e.target;
        if (input.type !== "file") return;
        const out = input.closest("label")?.querySelector(".picked");
        if (out) out.textContent = input.files.length ? `${input.files.length} selected` : "";
        if (!input.files.length) return;
        try {
          const copies = await Promise.all([...input.files].map(async (f) =>
            new File([await f.arrayBuffer()], f.name, { type: f.type, lastModified: f.lastModified })));
          const dt = new DataTransfer();
          copies.forEach((f) => dt.items.add(f));
          input.files = dt.files;  // setting it doesn't fire "change" again
        } catch {
          input.value = "";
          if (out) out.textContent = "couldn't read it, pick again";
        }
      });
    }
    // Back / forward greyed out when there's nowhere to go (where the browser can tell).
    if (!window.histReady) {
      window.histReady = true;
      const sync = () => {
        if (!window.navigation || !("canGoBack" in navigation)) return;
        const [b, f] = document.querySelectorAll(".histnav button");
        if (b) b.disabled = !navigation.canGoBack;
        if (f) f.disabled = !navigation.canGoForward;
      };
      addEventListener("load", sync);
      document.addEventListener("htmx:afterSettle", sync);
      addEventListener("popstate", () => setTimeout(sync, 50));
    }
    // 묶기 on a day's people: the button turns the meeting's chips into checkboxes; the groups that
    // all the chosen people are in are offered below (picking one labels them, see /day/…/label).
    if (!window.labelReady) {
      window.labelReady = true;
      // A group chosen whole (tap its chip) counts as all the people under it, and gives up its label.
      const opts = (mt) => {
        const ids = [...new Set([...mt.querySelectorAll("li[data-pid].sel")].map((li) => li.dataset.pid))];
        const gids = [...mt.querySelectorAll("li.group-chip.sel")].map((li) => li.dataset.gid);
        const box = mt.querySelector(".label-opts");
        if (!ids.length) { box.innerHTML = ""; return; }
        const day = mt.closest("#day-people").querySelector(".meet-input").dataset.day;
        htmx.ajax("GET", `/day/${day}/label/options?meeting=${mt.dataset.meeting}&ids=${ids.join(",")}&gids=${gids.join(",")}`, { target: box, swap: "innerHTML" });
      };
      document.addEventListener("click", (e) => {
        const toggle = e.target.closest(".label-toggle");
        if (toggle) {
          const mt = toggle.closest(".meeting");
          const on = mt.classList.toggle("selecting");
          toggle.textContent = on ? "Done" : "묶기";
          mt.querySelectorAll("details").forEach((d) => (d.open = on));
          mt.querySelectorAll("li.sel").forEach((li) => li.classList.remove("sel"));
          mt.querySelector(".label-opts").innerHTML = "";
          return;
        }
        // In 묶기, a group's chip selects the whole group (instead of opening its member list).
        const g = e.target.closest(".meeting.selecting li.group-chip");
        if (g && e.target.closest("summary")) {
          e.preventDefault();
          const on = g.classList.toggle("sel");
          g.querySelectorAll("li[data-pid]").forEach((x) => x.classList.toggle("sel", on));
          opts(g.closest(".meeting"));
          return;
        }
        const li = e.target.closest(".meeting.selecting li[data-pid]");
        if (li && !e.target.closest(".unpick")) {
          e.preventDefault();
          li.classList.toggle("sel");
          const chip = li.closest("li.group-chip");
          if (chip && !li.classList.contains("sel")) chip.classList.remove("sel");
          opts(li.closest(".meeting"));
        }
      }, true);
    }
    // Paste a picture into a log or the editor: it's added to that form's photos (saved with it).
    if (!window.pasteReady) {
      window.pasteReady = true;
      document.addEventListener("paste", (e) => {
        const input = e.target.closest?.("form")?.querySelector('input[type=file][name=photos]');
        const pics = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
        if (!input || !pics.length) return;
        e.preventDefault();
        const dt = new DataTransfer();
        for (const f of [...input.files, ...pics]) dt.items.add(f);
        input.files = dt.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
      });
    }
    // Offline-first: pages open from the last copy seen (see /sw.js). When the fresh copy differs,
    // swap it in, unless you're in the middle of something (typing, a menu open).
    if ("serviceWorker" in navigator && !window.swReady) {
      window.swReady = true;
      navigator.serviceWorker.register("/sw.js").catch(() => {});
      // The fresh copy can arrive before htmx has finished moving to the page: remember it, and
      // check again once the page has settled.
      const fresh = new Set();
      const refresh = () => {
        if (!fresh.has(location.href)) return;
        const busy = document.activeElement?.matches("input, textarea, select") || document.querySelector("main details[open]");
        if (busy) return;
        fresh.delete(location.href);
        htmx.ajax("GET", location.href, { target: "main", select: "main", swap: "outerHTML show:none",
                                          headers: { "X-Fresh": "1" } });
      };
      navigator.serviceWorker.addEventListener("message", (e) => {
        if (e.data?.type !== "fresh") return;
        fresh.add(e.data.url);
        refresh();
      });
      document.addEventListener("htmx:afterSettle", (e) => { if (e.detail.boosted || e.detail.requestConfig?.boosted) refresh(); });
      addEventListener("pageshow", refresh);
      // Warm the cache: shortly after the app opens, fetch the other tabs (and the days either side)
      // so the first tap on them is instant too. They go through /sw.js, which saves them.
      const warm = () => {
        if (!navigator.serviceWorker.controller) return;
        const links = [...document.querySelectorAll("nav.tabbar a[href], .day-head .nav a.icon-link[href^='/day/']")]
          .map((a) => a.getAttribute("href")).filter((h) => h && h !== location.pathname);
        links.forEach((h, i) => setTimeout(() => fetch(h, { headers: { "HX-Boosted": "true", "HX-Request": "true" } }).catch(() => {}), i * 150));
      };
      addEventListener("load", () => setTimeout(warm, 1500));
      navigator.serviceWorker.startMessages?.();
    }
    // Boosted navigation swaps only <body>, so a page left open across a deploy would get new markup
    // with the old stylesheet (unstyled chips etc.). If the page names a newer stylesheet, reload once.
    if (!window.assetCheck) {
      window.assetCheck = true;
      document.addEventListener("htmx:afterSettle", () => {
        const want = document.getElementById("asset-v")?.dataset.css;
        const have = document.querySelector('link[rel=stylesheet][href*="style.css"]')?.getAttribute("href");
        if (want && have && want !== have) location.reload();
      });
    }
    // Did that tap work? While a request is out, a bar runs along the top and the button you pressed
    // spins (and can't be pressed twice); a change that went through says so ("✓ Deleted"), and one
    // that didn't says that instead. Preloads and background refreshes stay quiet.
    if (!window.feedbackReady) {
      window.feedbackReady = true;
      let out = 0, barTimer = null;
      const pending = new WeakMap();  // request → { btn, text }
      const live = new WeakSet();     // requests out now (afterRequest can fire twice for one)
      const bar = () => document.getElementById("busy-bar") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "busy-bar" }));
      const quiet = (d) => d.requestConfig?.headers?.["HX-Preloaded"] === "true" || d.requestConfig?.headers?.["X-Fresh"] === "1";
      const done = { Delete: "Deleted", Save: "Saved", Add: "Added", Remove: "Removed", Hide: "Hidden" };
      const toast = (text, bad) => {
        document.getElementById("toast")?.remove();
        const t = Object.assign(document.createElement("div"), { id: "toast", className: bad ? "bad" : "", textContent: text });
        t.setAttribute("role", "status");
        document.body.appendChild(t);
        setTimeout(() => t.classList.add("out"), bad ? 4000 : 1800);
        setTimeout(() => t.remove(), bad ? 4400 : 2200);
      };
      document.addEventListener("htmx:beforeRequest", (e) => {
        const d = e.detail;
        if (quiet(d) || live.has(d.xhr)) return;
        live.add(d.xhr);
        out++;
        // Pages usually come from the saved copy at once: only show the bar if it takes a moment.
        clearTimeout(barTimer);
        barTimer = setTimeout(() => out && bar().classList.add("on"), d.requestConfig.verb === "get" ? 150 : 0);
        const btn = d.requestConfig.triggeringEvent?.submitter || (d.elt.matches("button, .btn") ? d.elt : null);
        if (d.requestConfig.verb === "get") return;
        if (btn) { btn.classList.add("is-busy"); btn.disabled = true; }
        pending.set(d.xhr, { btn, text: btn?.dataset.done || done[btn?.textContent.trim().split(/\s/)[0]] || (btn ? "Done" : "Saved") });
      });
      document.addEventListener("htmx:afterRequest", (e) => {
        const d = e.detail;
        if (!live.has(d.xhr)) return;
        live.delete(d.xhr);
        out = Math.max(0, out - 1);
        if (!out) { clearTimeout(barTimer); document.getElementById("busy-bar")?.classList.remove("on"); }
        const job = pending.get(d.xhr);
        if (job?.btn) { job.btn.classList.remove("is-busy"); job.btn.disabled = false; }
        if (d.requestConfig.verb === "get") {
          if (d.failed && !d.xhr?.status) toast("Couldn't load — check your connection", true);
          return;
        }
        if (d.successful) window.caches?.delete("pages-v1").catch(() => {});  // see /sw.js
        // After the page has been swapped in, so the message lands on the new page.
        requestAnimationFrame(() => d.successful ? toast(`✓ ${job?.text || "Saved"}`)
          : toast(d.xhr?.status ? `Didn't work (${d.xhr.status}) — try again` : "Didn't go through — check your connection and try again", true));
      });
    }
    // People picker: Enter picks the first match; Esc or a click elsewhere closes the list.
    // (Boosted page loads re-run this script, so the listeners are added once.)
    if (!window.pickerReady) {
      window.pickerReady = true;
      document.addEventListener("keydown", (e) => {
        const input = e.target.closest?.(".picker input");
        if (!input || e.isComposing) return;
        const list = input.nextElementSibling;
        if (e.key === "Enter") { e.preventDefault(); list.querySelector("button")?.click(); }
        if (e.key === "Escape") { list.innerHTML = ""; input.blur(); }
      });
      document.addEventListener("click", (e) => {
        document.querySelectorAll(".picker").forEach((p) => { if (!p.contains(e.target)) p.querySelector(".suggest").innerHTML = ""; });
      });
      // After a pick the list is re-rendered: put the cursor back in the same picker, so adding
      // several people in a row (on a phone too) is pick, pick, pick.
      let again = null;
      document.addEventListener("click", (e) => {
        if (e.target.closest(".picker .suggest button")) again = e.target.closest(".picker").querySelector("input")?.getAttribute("hx-get");
      }, true);
      document.addEventListener("htmx:afterSettle", () => {
        if (!again) return;
        const input = [...document.querySelectorAll(".picker input")].find((i) => i.getAttribute("hx-get") === again);
        again = null;
        input?.focus({ preventScroll: true });
      });
    }
  </script>
</body>
</html>
